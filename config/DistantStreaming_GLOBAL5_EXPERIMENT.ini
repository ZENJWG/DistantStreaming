; Streaming/cache profile. Project2DFX owns bulk/category model preloading and visual distance.

; Catalog hints require live identity validation; warming uses observed selected sources.
[WorldResidency]
Enabled=1
WarmObservedModLoaderSources=1
WarmCatalogDependencies=1
WarmVerifiedImgMembers=1
ObservedWarmMaxSourceMiB=512
ObservedWarmMaxTotalMiB=4096
ObservedWarmMaxSources=256
CatalogQueryIntervalMs=100
RescanIntervalMs=1000

[FrameStability]
Enabled=1
AllowBlockingCameraLoads=0
ControllerIntervalMs=40
SlowControllerUs=4000
SlowControllerRetryMs=200
MaxPredictiveCells=96
MaxPredictiveCandidates=384

[General]
Enabled=1
Telemetry=1
UpdateIntervalMs=20

[Diagnostics]
HookMode=1
ControllerEnabled=1
ReadinessTelemetry=0
HookIntegrityMonitor=1
HookCheckIntervalMs=1000
RecoverPristineHooks=1

; GTA remains 32-bit. Limit 0 uses VA-aware sizing; retain address-space reserve.
[Memory]
ManageStreamingMemory=1
DistantStreamingOwnsNativeBudget=1
StreamingMemoryLimitMiB=0
AddressSpaceReserveMiB=768
ThrottlePercent=90
HighPercent=95
ResumePercent=82
MaxWorkingSetMiB=0
MaxPrivateMiB=0
MinPhysicalAvailableMiB=512

[Prefetch]
Enabled=1
LookAheadMs=3500
MaximumPredictionUnits=400
SectorRadiusUnits=200
TeleportThresholdUnits=120
MaxSectorScans=96
MaxCandidates=384
MaxRequestsPerTick=16
MaxAdaptiveRequests=12
MaxOutstanding=96
BacklogLimit=96
MaxPriorityRequestsPerTick=4
PriorityRadiusUnits=160
ExpiryMs=5000
CooldownMs=2500

[Performance]
CautionFrameMs=20
SlowFrameMs=33
SlowLoadingUs=12000

[CameraReadiness]
Enabled=1
BlockingLoad=0
InstanceLoaded=1
IntervalMs=100
RangeUnits=480
HalfAngleDegrees=80
MaxModelsPerBatch=8
MaxInstancesPerBatch=4
MaxBatchSectors=32768
MaxScanCells=16
MaxScanNodes=768
MaxScanUs=1500

[OffscreenCleanup]
Enabled=1
DisableBlockingLoads=1
UnloadUnusedModels=1
UnloadUnusedTextures=0
KeepNearPlayerUnits=200
OffscreenGraceMs=2500
RequestQuietMs=8000
MaxScanPerFrame=256
MaxDeletesPerFrame=2
MaxPressureDeletesPerFrame=6
MaxModelUnloadsPerFrame=1
TimeBudgetUs=900
MaxUnloadSectors=4096
HelperFirstNativeTrim=1
TrimStartHeadroomMiB=256
TrimStopHeadroomMiB=512
TrimMinHelperCacheMiB=64
TrimMaxNativeBacklog=24
TrimScanPerPass=256
TrimStableMs=8000
TrimIntervalMs=250

[Profiling]
ArchiveSelection=0
SampleEveryNCalls=128
SlowThresholdUs=1000

[DynamicReadiness]
Enabled=1
MaxRequestsPerTick=2
HistoryMs=15000
MinObservations=2
MinRepeatGapMs=250
RewarmCooldownMs=10000
LocalRadiusUnits=200
MaxHistoryModels=64

; Soft VRAM ceiling; Windows driver budget remains authoritative. PreLoad can stall.
[GPUResidency]
FramePacingTelemetry=0
DrawCallTelemetry=0
Enabled=1
TargetMiB=10240
BudgetHeadroomMiB=1024
SampleBudgetMs=500
ReportIntervalMs=10000
ManageResources=1
ManagedPriority=16
PrioritizeUsedManaged=1
UsedManagedPriority=64
BindPrioritySampleRate=128
PreloadManaged=0
PreloadMinAgeMs=100
PreloadMaxResourceMiB=1
PreloadQueueMiB=16
PreloadJobsPerFrame=1
PreloadBudgetUs=250
PreloadMaxAgeMs=900
PreloadIntervalMs=33

[ArchivePreload]
Enabled=0
BinaryIPLs=0
VanillaModelSources=0
CacheLimitMiB=192
MaxEntryMiB=8
ReadPauseMs=5
ReportMs=10000

; Matching x64 helper required. CacheLimitMiB is helper RAM; local cache uses GTA VA.
[ExternalAssetCache64]
Enabled=1
InterceptCdStreamRead=1
InterceptModLoaderLooseReads=1
ServeModLoaderReadyHits=1
MaxModLoaderReadMiB=8
ServeReadyCdStreamHits=0
MaxCdStreamCopyKiB=512
InterceptCdStreamReadFile=0
ReadThroughSynchronousIMG=1
CacheLimitMiB=12288
DiscoverModLoaderArchives=1
BackgroundArchiveWarming=0
GameLocalCacheMiB=64
LimitInGameArchiveCacheMiB=32
MaxQueuedReads=128
ReportMs=10000
