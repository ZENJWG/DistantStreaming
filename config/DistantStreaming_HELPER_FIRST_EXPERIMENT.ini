; Streaming/cache profile. Project2DFX owns bulk/category model preloading and visual distance.
; Specialized alternative profile; settings differ from the high-end primary INI.
; Project2DFX/game owns visual distance.

; Catalog hints require live identity validation; warming uses observed selected sources.
[WorldResidency]
Enabled=0

[General]
Enabled=1
Telemetry=1
UpdateIntervalMs=40

[Diagnostics]
HookMode=1
ControllerEnabled=1
ReadinessTelemetry=0
HookIntegrityMonitor=1
HookCheckIntervalMs=1000
RecoverPristineHooks=1

; GTA remains 32-bit. Limit 0 uses VA-aware sizing; retain address-space reserve.
[Memory]
ManageStreamingMemory=1
DistantStreamingOwnsNativeBudget=1
StreamingMemoryLimitMiB=1664
AddressSpaceReserveMiB=896
ThrottlePercent=88
HighPercent=94
ResumePercent=79
MaxWorkingSetMiB=0
MaxPrivateMiB=0
MinPhysicalAvailableMiB=192

[Prefetch]
Enabled=1
LookAheadMs=2800
MaximumPredictionUnits=340
SectorRadiusUnits=160
TeleportThresholdUnits=120
MaxSectorScans=96
MaxCandidates=384
MaxRequestsPerTick=8
MaxAdaptiveRequests=6
MaxOutstanding=36
BacklogLimit=48
MaxPriorityRequestsPerTick=2
PriorityRadiusUnits=100
ExpiryMs=4200
CooldownMs=4500

[Performance]
CautionFrameMs=20
SlowFrameMs=33
SlowLoadingUs=12000

[CameraReadiness]
Enabled=1
BlockingLoad=0
InstanceLoaded=1
IntervalMs=120
RangeUnits=340
HalfAngleDegrees=70
MaxModelsPerBatch=8
MaxInstancesPerBatch=4
MaxBatchSectors=16384

[OffscreenCleanup]
Enabled=1
DisableBlockingLoads=1
UnloadUnusedModels=1
UnloadUnusedTextures=0
KeepNearPlayerUnits=120
OffscreenGraceMs=900
RequestQuietMs=5000
MaxScanPerFrame=256
MaxDeletesPerFrame=3
MaxPressureDeletesPerFrame=5
MaxModelUnloadsPerFrame=1
TimeBudgetUs=900
MaxUnloadSectors=4096
HelperFirstNativeTrim=1
TrimStartHeadroomMiB=256
TrimStopHeadroomMiB=512
TrimMinHelperCacheMiB=64
TrimMaxNativeBacklog=24
TrimScanPerPass=256
TrimStableMs=5000
TrimIntervalMs=200

[Profiling]
ArchiveSelection=1
SampleEveryNCalls=16
SlowThresholdUs=1000

[DynamicReadiness]
Enabled=1
MaxRequestsPerTick=1
HistoryMs=10000
MinObservations=2
MinRepeatGapMs=350
RewarmCooldownMs=15000
LocalRadiusUnits=120
MaxHistoryModels=32

; Soft VRAM ceiling; Windows driver budget remains authoritative. PreLoad can stall.
[GPUResidency]
FramePacingTelemetry=0
DrawCallTelemetry=1
Enabled=1
TargetMiB=10240
BudgetHeadroomMiB=1536
SampleBudgetMs=500
ReportIntervalMs=10000
ManageResources=1
ManagedPriority=16
PrioritizeUsedManaged=1
UsedManagedPriority=64
BindPrioritySampleRate=128
PreloadManaged=0
PreloadMinAgeMs=100
PreloadMaxResourceMiB=1
PreloadQueueMiB=16
PreloadJobsPerFrame=1
PreloadBudgetUs=250
PreloadMaxAgeMs=900
PreloadIntervalMs=33

[ArchivePreload]
Enabled=0
BinaryIPLs=0
VanillaModelSources=0
CacheLimitMiB=192
MaxEntryMiB=8
ReadPauseMs=5
ReportMs=10000

; Matching x64 helper required. CacheLimitMiB is helper RAM; local cache uses GTA VA.
[ExternalAssetCache64]
Enabled=1
InterceptCdStreamRead=1
InterceptModLoaderLooseReads=1
ServeModLoaderReadyHits=1
MaxModLoaderReadMiB=8
ServeReadyCdStreamHits=0
MaxCdStreamCopyKiB=512
InterceptCdStreamReadFile=0
ReadThroughSynchronousIMG=1
CacheLimitMiB=8192
DiscoverModLoaderArchives=1
BackgroundArchiveWarming=0
GameLocalCacheMiB=48
LimitInGameArchiveCacheMiB=32
MaxQueuedReads=64
ReportMs=10000
